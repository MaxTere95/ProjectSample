[versions]
# ==============================================================================
# COMMON VERSIONS (Общий код для Клиента и Сервера)
# ==============================================================================
common-di-koin = "4.2.2"
common-kotlin = "2.4.10"
common-kotlin-coroutines = "1.11.0"
common-kotlin-datetime = "0.8.0"
common-kotlin-immutable = "0.5.1"
common-kotlin-serialization = "1.11.0"
common-network-ktor = "3.5.2"

# ==============================================================================
# CLIENT VERSIONS (Только для клиентских приложений)
# ==============================================================================
client-arch-decompose = "3.5.0"
client-arch-essenty = "2.5.0"
client-arch-viewmodel = "2.11.0"

client-db-sqldelight = "2.3.2"

client-network-retrofit = "3.0.0"
client-network-retrofit-adapter = "1.1.0"

client-platform-android-agp = "8.10.0"
client-platform-android-compileSdk = "36"
client-platform-android-minSdk = "26"
client-platform-android-targetSdk = "36"

client-platform-androidx-activity = "1.13.0"
client-platform-androidx-appcompat = "1.8.0"
client-platform-androidx-constraintlayout = "2.2.2"
client-platform-androidx-core-ktx = "1.19.0"
client-platform-android-material = "1.14.0"

client-storage-settings = "1.3.0"

client-test-android-espresso = "3.7.0"
client-test-android-junit = "1.3.0"

client-ui-coil = "3.5.0"
client-ui-compose = "1.11.1"
client-ui-compose-icons = "1.7.3"
client-ui-moko-res = "0.26.4"

# ==============================================================================
# SERVER VERSIONS (Только для бэкенда)
# ==============================================================================
server-db-exposed = "1.4.0"
server-db-sqlite-jdbc = "3.53.2.1"
server-log-logback = "1.6.3"
server-network-springBoot = "4.1.0"
server-network-springDependency = "1.1.7"

# === Global Global Tests ===
test-junit = "4.13.2"

[libraries]
# ==============================================================================
# COMMON LIBRARIES (Доступны и клиенту, и серверу)
# ==============================================================================
# --- Dependency Injection (Внедрение зависимостей Koin) ---
common-di-koin-core = { module = "io.insert-koin:koin-core", version.ref = "common-di-koin" }
common-di-koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "common-di-koin" }

# --- Core Kotlin Tools (Библиотеки экосистемы Kotlin) ---
common-kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "common-kotlin-coroutines" }
common-kotlin-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "common-kotlin-coroutines" }
common-kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "common-kotlin-datetime" }
common-kotlin-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "common-kotlin-immutable" }
common-kotlin-script-runtime = { module = "org.jetbrains.kotlin:kotlin-script-runtime", version.ref = "common-kotlin" }
common-kotlin-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "common-kotlin-serialization" }
common-kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "common-kotlin-serialization" }

# --- Build-time Plugins Dependencies (Зависимости плагинов Gradle) ---
common-kotlin-gradleplugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "common-kotlin" }
common-kotlin-gradleplugin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "common-kotlin" }

# ==============================================================================
# CLIENT LIBRARIES (Только для Android / Desktop JVM приложений)
# ==============================================================================
# --- Client Architecture & Lifecycle (Навигация Decompose) ---
client-arch-decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "client-arch-decompose" }
client-arch-decompose-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "client-arch-decompose" }
client-arch-essenty-lifecycle = { module = "com.arkivanov.essenty:lifecycle", version.ref = "client-arch-essenty" }
client-arch-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "client-arch-viewmodel" }

# --- Client UI, Graphics & Resources (Compose Multiplatform & Ресурсы) ---
client-ui-coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "client-ui-coil" }
client-ui-coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "client-ui-coil" }
client-ui-compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "client-ui-compose" }
client-ui-compose-desktop-common = { module = "org.jetbrains.compose.desktop:desktop", version.ref = "client-ui-compose" }
client-ui-compose-desktop-material = { module = "org.jetbrains.compose.material:material-desktop", version.ref = "client-ui-compose" }
client-ui-compose-desktop-material3 = { module = "org.jetbrains.compose.material3:material3-desktop", version.ref = "client-ui-compose" }
client-ui-compose-desktop-windows = { module = "org.jetbrains.compose.desktop:desktop-jvm-windows-x64", version.ref = "client-ui-compose" }
client-ui-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "client-ui-compose" }
client-ui-compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "client-ui-compose" }
client-ui-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "client-ui-compose" }
client-ui-compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "client-ui-compose-icons" }
client-ui-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "client-ui-compose" }
client-ui-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "client-ui-compose" }
client-ui-compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "client-ui-compose" }
client-ui-compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "client-ui-compose" }
client-ui-moko-res-compose = { module = "dev.icerock.moko:resources-compose", version.ref = "client-ui-moko-res" }
client-ui-moko-res-core = { module = "dev.icerock.moko:resources", version.ref = "client-ui-moko-res" }
client-ui-moko-res-generator = { module = "dev.icerock.moko:resources-generator", version.ref = "client-ui-moko-res" }

# --- Client UI Runtime (Специфичные потоки выполнения для UI) ---
client-kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "common-kotlin-coroutines" }
client-kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "common-kotlin-coroutines" }

# --- Client Storage & Key-Value (Локальные настройки) ---
client-storage-settings-core = { module = "com.russhwolf:multiplatform-settings", version.ref = "client-storage-settings" }
client-storage-settings-noarg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "client-storage-settings" }

# --- Client Databases (Локальная база данных SQLDelight) ---
client-db-sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "client-db-sqldelight" }
client-db-sqldelight-core = { module = "app.cash.sqldelight:runtime", version.ref = "client-db-sqldelight" }
client-db-sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "client-db-sqldelight" }
client-db-sqldelight-desktop = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "client-db-sqldelight" }
client-db-sqldelight-ios = { module = "app.cash.sqldelight:native-driver", version.ref = "client-db-sqldelight" }
client-plugin-sqldelight = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "client-db-sqldelight" }

# --- Client DI Integration (Интеграция Koin в Compose) ---
client-di-koin-android = { module = "io.insert-koin:koin-android", version.ref = "common-di-koin" }
client-di-koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "common-di-koin" }
client-di-koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "common-di-koin" }

# --- Client Network: Ktor Client (Мультиплатформенный сетевой стек) ---
client-network-ktor-android = { module = "io.ktor:ktor-client-android", version.ref = "common-network-ktor" }
client-network-ktor-cio = { module = "io.ktor:ktor-client-cio", version.ref = "common-network-ktor" }
client-network-ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "common-network-ktor" }
client-network-ktor-ios = { module = "io.ktor:ktor-client-ios", version.ref = "common-network-ktor" }
#client-network-ktor-json = { module = "io.ktor:ktor-client-json", version.ref = "common-network-ktor" }
client-network-ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "common-network-ktor" }
client-network-ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "common-network-ktor" }
client-network-ktor-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "common-network-ktor" }
client-network-ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "common-network-ktor" }

# --- Client Network: Retrofit Stack (Только для JVM / Android Platform) ---
client-network-retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "client-network-retrofit" }
client-network-retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "client-network-retrofit" }
client-network-retrofit-resultAdapter = { module = "com.github.skydoves:retrofit-adapters-result", version.ref = "client-network-retrofit-adapter" }

# --- Client Android Native Platform Dependencies ---
client-platform-android-activity = { module = "androidx.activity:activity", version.ref = "client-platform-androidx-activity" }
client-platform-android-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "client-platform-androidx-activity" }
client-platform-android-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "client-platform-androidx-activity" }
client-platform-android-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "client-platform-androidx-appcompat" }
client-platform-android-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "client-platform-androidx-constraintlayout" }
client-platform-android-core-ktx = { module = "androidx.core:core-ktx", version.ref = "client-platform-androidx-core-ktx" }
client-platform-android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "client-platform-android-agp" }
client-platform-android-material = { module = "com.google.android.material:material", version.ref = "client-platform-android-material" }

# --- Client Local Test dependencies ---
client-test-android-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "client-test-android-espresso" }
client-test-android-junit = { module = "androidx.test.ext:junit", version.ref = "client-test-android-junit" }

# ==============================================================================
# SERVER LIBRARIES (Только для бэкенда: Ktor Server / Spring Boot)
# ==============================================================================
# --- Server Network: Ktor Server ---
server-network-ktor-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "common-network-ktor" }
server-network-ktor-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "common-network-ktor" }
server-network-ktor-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "common-network-ktor" }

# --- Server Network: Spring Boot ---
server-network-spring-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "server-network-springBoot" }

# --- Server Databases & ORM: JetBrains Exposed ---
server-db-exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "server-db-exposed" }
server-db-exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "server-db-exposed" }
server-db-exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "server-db-exposed" }

# --- Server Databases & ORM: Hibernate / Spring Data JPA ---
server-db-spring-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "server-network-springBoot" }

# --- Server Database JDBC Drivers ---
server-db-driver-sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "server-db-sqlite-jdbc" }

# --- Server Logging, Metrics & Testing ---
server-log-logback = { module = "ch.qos.logback:logback-classic", version.ref = "server-log-logback" }
server-network-ktor-tests = { module = "io.ktor:ktor-server-tests-jvm", version.ref = "common-network-ktor" }

# ==============================================================================
# GLOBAL TESTING (Общие независимые библиотеки тестирования)
# ==============================================================================
test-global-junit = { group = "junit", name = "junit", version.ref = "test-junit" }
test-kotlin-core = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "common-kotlin" }
test-kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "common-kotlin-coroutines" }
test-kotlin-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "common-kotlin" }

[plugins]
# ==============================================================================
# COMMON PLUGINS (Общие плагины для проекта)
# ==============================================================================
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "common-kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "common-kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "common-kotlin" }

# ==============================================================================
# CLIENT PLUGINS (Плагины только для клиентских приложений)
# ==============================================================================
android-application = { id = "com.android.application", version.ref = "client-platform-android-agp" }
android-kmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "client-platform-android-agp" }
android-library = { id = "com.android.library", version.ref = "client-platform-android-agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "common-kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "client-ui-compose" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "common-kotlin" }
moko-res = { id = "dev.icerock.mobile.multiplatform-resources", version.ref = "client-ui-moko-res" }
sqlDelight = { id = "app.cash.sqldelight", version.ref = "client-db-sqldelight" }

# ==============================================================================
# SERVER PLUGINS (Плагины только для бэкенда)
# ==============================================================================
ktor = { id = "io.ktor.plugin", version.ref = "common-network-ktor" }
spring-boot = { id = "org.springframework.boot", version.ref = "server-network-springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "server-network-springDependency" }
